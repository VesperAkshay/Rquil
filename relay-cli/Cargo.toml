[package]
name = "relay-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
relay-core = { version = "0.1.0", path = "../relay-core" }
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
